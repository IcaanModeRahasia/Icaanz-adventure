<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Icaanz Adventure</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; touch-action: none; }
        canvas { background-color: #fff; border: 2px solid #333; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Icaanz Adventure</h1>
    <div id="score-board">SKOR: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="250"></canvas>
    <p>Klik di kotak atau tekan <strong>SPASI</strong> untuk lompat</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0, gameSpeed = 5, isGameOver = false, frameCount = 0;

        const player = {
            x: 50, y: 200, width: 40, height: 40, dy: 0, jumpForce: 12, gravity: 0.6, grounded: true,
            draw: function() {
                ctx.font = "40px serif";
                ctx.fillText("🕺", this.x, this.y);
            },
            update: function() {
                if (!this.grounded) {
                    this.dy += this.gravity;
                    this.y += this.dy;
                }
                if (this.y >= 200) {
                    this.y = 200;
                    this.dy = 0;
                    this.grounded = true;
                }
            }
        };

        const obstacles = [];
        class Obstacle {
            constructor(type) {
                this.type = type;
                this.x = 800;
                this.y = type === 'cactus' ? 200 : 160;
            }
            draw() {
                ctx.font = "35px serif";
                ctx.fillText(this.type === 'cactus' ? "🌵" : "🦅", this.x, this.y);
            }
        }

        function jump() {
            if (player.grounded) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            }
            if (isGameOver) location.reload();
        }

        // Event Listener untuk lompat
        window.addEventListener("keydown", (e) => { if(e.code === "Space") jump(); });
        canvas.addEventListener("mousedown", jump);
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });

        function gameLoop() {
            if (dongo,kamu-kalah) return;
            ctx.clearRect(0, 0, 800, 250);
            
            player.update();
            player.draw();

            frameCount++;
            if (frameCount % 100 === 0) obstacles.push(new Obstacle(Math.random() < 0.3 ? 'bird' : 'cactus'));

            obstacles.forEach((obs, index) => {
                obs.x -= gameSpeed;
                obs.draw();
                
                if (obs.x < player.x + 30 && obs.x + 30 > player.x && player.y + 40 > obs.y) {
                    isGameOver = true;
                    alert("Game Over! Skor: " + score);
                    location.reload();
                }
                if (obs.x < -40) obstacles.splice(index, 1);
            });

            score++;
            scoreElement.innerText = score;
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
