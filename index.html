<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Icaanz Adventure</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            background: #f7f7f7; 
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { margin-bottom: 5px; color: #222; }
        #score-container { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #555; }
        canvas { 
            background-color: #fff; 
            border: 2px solid #333; 
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .info { margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Icaanz Adventure</h1>
    <div id="score-container">SKOR: <span id="score">0</span> | SPEED: <span id="speed-text">1.0x</span></div>
    <canvas id="gameCanvas" width="800" height="250"></canvas>
    <p class="info">Tekan <strong>SPASI / PANAH ATAS</strong> atau <strong>KLIK CANVAS</strong> untuk melompat</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const speedElement = document.getElementById("speed-text");

        let score = 0;
        let gameSpeed = 5; 
        let isGameOver = false;
        let obstacles = [];
        let spawnTimer = 0;
        let nextSpawnInterval = 120; 

        // Karakter Ninja Sasuke (Menggunakan Grafis Canvas Dinamis)
        const player = {
            x: 60,
            y: 165, 
            width: 35,
            height: 40,
            gravity: 0.6,
            velocity: 0,
            jumpForce: -13,
            isGrounded: false,
            draw: function() {
                // 1. Badan/Baju Ninja Sasuke (Hitam)
                ctx.fillStyle = "#1a1a1a";
                ctx.fillRect(this.x, this.y + 12, this.width, this.height - 12);
                
                // 2. Kepala/Muka (Warna Kulit)
                ctx.fillStyle = "#ffd1a4";
                ctx.fillRect(this.x + 5, this.y, this.width - 10, 14);
                
                // 3. Rambut Sasuke (Hitam di bagian atas)
                ctx.fillStyle = "#000";
                ctx.fillRect(this.x + 3, this.y - 3, this.width - 6, 5);

                // 4. Ikat Kepala Konoha (Biru Tua)
                ctx.fillStyle = "#0f2a4a";
                ctx.fillRect(this.x + 5, this.y + 2, this.width - 10, 4);
                
                // Logo pelat besi di ikat kepala (Abu-abu)
                ctx.fillStyle = "#bbb";
                ctx.fillRect(this.x + 13, this.y + 3, 9, 2);

                // 5. Mata Sharingan (Merah)
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(this.x + 22, this.y + 7, 3, 3); // Mata depan
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                if (this.y >= 165) {
                    this.y = 165;
                    this.velocity = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }
            }
        };

        function jump() {
            if (player.isGrounded) {
                player.velocity = player.jumpForce;
                player.isGrounded = false;
            }
        }

        // Spawn Rintangan Vektor (Kaktus / Burung)
        function spawnObstacle() {
            let type = Math.random() < 0.35 ? 'bird'
