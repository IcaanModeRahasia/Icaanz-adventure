<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Icaanz Adventure</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; }
        canvas { background-color: #fff; border: 2px solid #333; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Icaanz Adventure</h1>
    <div id="score-board">SKOR: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="250"></canvas>
    <p>Gunakan <strong>SPASI</strong> untuk melompat</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0, gameSpeed = 5, isGameOver = false, frameCount = 0;

        const player = {
            x: 50, y: 190, width: 40, height: 40, dy: 0, jumpForce: 12, gravity: 0.6, grounded: true,
            draw: function() {
                ctx.font = "40px sans-serif";
                ctx.textBaseline = "top";
                ctx.fillText("🥷", this.x, this.y); // Sasuke
            },
            update: function() {
                if (!this.grounded) {
                    this.dy += this.gravity;
                    this.y += this.dy;
                }
                if (this.y + this.height >= 240) {
                    this.y = 200; // Reset ke posisi tanah
                    this.dy = 0;
                    this.grounded = true;
                }
            }
        };

        const obstacles = [];
        class Obstacle {
            constructor(type) {
                this.type = type;
                this.x = canvas.width;
                this.y = type === 'cactus' ? 200 : 160; // Burung lebih tinggi
                this.width = 30; this.height = 40;
            }
            draw() {
                ctx.font = "35px sans-serif";
                ctx.fillText(this.type === 'cactus' ? "🌵" : "🦅", this.x, this.y);
            }
        }

        function gameLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Ground
            ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(800, 240); ctx.stroke();

            player.update();
            player.draw();

            frameCount++;
            if (frameCount % 100 === 0) obstacles.push(new Obstacle(Math.random() < 0.3 ? 'bird' : 'cactus'));

            obstacles.forEach((obs, index) => {
                obs.x -= gameSpeed;
                obs.draw();
                
                // Cek tabrakan
                if (obs.x < player.x + 30 && obs.x + 30 > player.x && player.y + 40 > obs.y) {
                    isGameOver = true;
                    alert("Dongo kamu klh🤣! Skor kamu: " + score);
                    location.reload();
                }
                if (obs.x < -40) obstacles.splice(index, 1);
            });

            score++;
            scoreElement.innerText = score;
            if (score % 200 === 0) gameSpeed += 0.5;

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space" && player.grounded) { player.dy = -player.jumpForce; player.grounded = false; } });
        gameLoop();
    </script>
</body>
</html>
