<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icaanz Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f7f7f7;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        #game-container {
            position: relative;
            margin-top: 20px;
        }

        canvas {
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #score-board {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        #game-over h2 {
            margin: 0;
            color: #d32f2f;
            font-size: 30px;
        }

        #game-over p {
            font-size: 16px;
            color: #555;
            cursor: pointer;
            background: #eee;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        .instructions {
            margin-top: 15px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Icaanz Adventure</h1>
    
    <div id="game-container">
        <div id="score-board">HI: <span id="highscore">0</span> | SKOR: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="800" height="250"></canvas>
        <div id="game-over">
            <h2>GAME OVER</h2>
            <p onclick="resetGame()">Tekan Spasi atau Klik di sini untuk Main Lagi</p>
        </div>
    </div>

    <div class="instructions">
        Tekan <strong>SPASI</strong>, <strong>Panah Atas</strong>, atau <strong>Sentuh Layar</strong> untuk melompat.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highscore");
        const gameOverScreen = document.getElementById("game-over");

        // Variabel Game
        let score = 0;
        let highScore = localStorage.getItem("icaanz_highscore") || 0;
        highScoreElement.innerText = highScore;
        let gameSpeed = 5;
        let isGameOver = false;
        let frameCount = 0;

        // Karakter (Sasuke)
        const player = {
            x: 50,
            y: 200,
            width: 40,
            height: 40,
            dy: 0,
            jumpForce: 12,
            gravity: 0.6,
            grounded: true,
            draw: function() {
                ctx.font = "40px Arial";
                ctx.fillText("🥷", this.x, this.y + this.height);
            },
            update: function() {
                // Terapkan gravitasi
                if (!this.grounded) {
                    this.dy += this.gravity;
                    this.y += this.dy;
                }

                // Cek tanah (lantai)
                if (this.y + this.height >= 240) {
                    this.y = 240 - this.height;
                    this.dy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }
            },
            jump: function() {
                if (this.grounded) {
                    this.dy = -this.jumpForce;
                    this.grounded = false;
                }
            }
        };

        // Rintangan (Kaktus & Burung)
        const obstacles = [];
        
        class Obstacle {
            constructor(type) {
                this.type = type; // 'cactus' atau 'bird'
                this.width = type === 'cactus' ? 30 : 40;
                this.height = type === 'cactus' ? 40 : 30;
                this.x = canvas.width;
                // Burung melayang lebih tinggi, kaktus di tanah
                this.y = type === 'cactus' ? 240 - this.height : 240 - this.height - 45; 
            }

            draw() {
                ctx.font = this.type === 'cactus' ? "35px Arial" : "30px Arial";
                const emoji = this.type === 'cactus' ? "🌵" : "🦅";
                ctx.fillText(emoji, this.x, this.y + this.height);
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        // Kontrol
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (isGameOver) resetGame();
                else player.jump();
            }
        });
        window.addEventListener("touchstart", () => {
            if (isGameOver) resetGame();
            else player.jump();
        });

        // Spawn rintangan acak
        function spawnObstacle() {
            let type = Math.random() < 0.3 ? 'bird' : 'cactus'; // 30% kemungkinan burung
            obstacles.push(new Obstacle(type));
        }

        // Cek tabrakan
        function checkCollision(rect1, rect2) {
            // Karena menggunakan emoji, hitbox disesuaikan sedikit agar lebih adil (tidak terlalu ketat)
            const padding = 10; 
            return (
                rect1.x < rect2.x + rect2.width - padding &&
                rect1.x + rect1.width - padding > rect2.x &&
                rect1.y < rect2.y + rect2.height - padding &&
                rect1.y + rect1.height - padding > rect2.y
            );
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            obstacles.length = 0;
            isGameOver = false;
            gameOverScreen.style.display = "none";
            player.y = 200;
            player.dy = 0;
            frameCount = 0;
            gameLoop();
        }

        function drawGround() {
            ctx.beginPath();
            ctx.moveTo(0, 240);
            ctx.lineTo(canvas.width, 240);
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function gameLoop() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();

            // Update & Draw Player
            player.update();
            player.draw();

            // Handle Rintangan
            frameCount++;
            
            // Logika spawn: Semakin cepat game, semakin sering rintangan muncul
            const spawnRate = Math.max(60, 120 - Math.floor(gameSpeed * 5)); 
            if (frameCount % spawnRate === 0) {
                spawnObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();
                obs.draw();
